<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PawPath - Iniciar Sesión</title>
<!-- Google Fonts: Quicksand for the playful claymorphic brand feel -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols for the tactile icons -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fbf9f8; /* background from theme */
            overflow: hidden;
        }

        /* Claymorphism Custom Utilities */
        .clay-card {
            background: #ffffff;
            border-radius: 3rem; /* xl from theme */
            box-shadow: 
                20px 20px 60px rgba(58, 103, 88, 0.1), /* primary shadow */
                -20px -20px 60px rgba(255, 255, 255, 0.8),
                inset 8px 8px 16px rgba(255, 255, 255, 0.5),
                inset -8px -8px 16px rgba(0, 0, 0, 0.02);
        }

        .clay-input {
            background: #f5f3f3; /* surface-container-low */
            border: none;
            box-shadow: 
                inset 6px 6px 12px rgba(0, 0, 0, 0.05),
                inset -6px -6px 12px rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }

        .clay-input:focus {
            outline: none;
            box-shadow: 
                inset 8px 8px 16px rgba(58, 103, 88, 0.08),
                inset -8px -8px 16px rgba(255, 255, 255, 1);
        }

        .clay-button-primary {
            background-color: #3a6758; /* primary from theme */
            color: #ffffff;
            border-radius: 2rem;
            box-shadow: 
                8px 8px 16px rgba(58, 103, 88, 0.25),
                -8px -8px 16px rgba(255, 255, 255, 0.8),
                inset 4px 4px 8px rgba(255, 255, 255, 0.3),
                inset -4px -4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .clay-button-primary:active {
            transform: scale(0.96);
            box-shadow: 
                inset 6px 6px 12px rgba(0, 0, 0, 0.3),
                inset -6px -6px 12px rgba(255, 255, 255, 0.1);
        }

        .clay-logo-icon {
            background: #bcedda; /* primary-fixed */
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.05),
                -10px -10px 20px rgba(255,255,255,0.9),
                inset 6px 6px 10px rgba(255,255,255,0.4),
                inset -6px -6px 10px rgba(0,0,0,0.05);
        }

        /* Floating Animation for Atmosphere */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#cee5ff",
                    "surface": "#fbf9f8",
                    "tertiary": "#685d47",
                    "tertiary-container": "#dacbb0",
                    "inverse-primary": "#a1d1bf",
                    "surface-tint": "#3a6758",
                    "secondary": "#396285",
                    "surface-bright": "#fbf9f8",
                    "on-background": "#1b1c1c",
                    "tertiary-fixed": "#f1e1c5",
                    "inverse-on-surface": "#f2f0f0",
                    "on-tertiary-fixed": "#221b09",
                    "background": "#fbf9f8",
                    "primary-fixed-dim": "#a1d1bf",
                    "on-secondary-fixed": "#001d32",
                    "surface-container-highest": "#e4e2e2",
                    "primary-fixed": "#bcedda",
                    "on-primary": "#ffffff",
                    "outline-variant": "#c0c8c3",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-container": "#605540",
                    "surface-dim": "#dbd9d9",
                    "surface-variant": "#e4e2e2",
                    "inverse-surface": "#303030",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "surface-container-high": "#eae8e7",
                    "on-primary-fixed-variant": "#214f41",
                    "on-surface": "#1b1c1c",
                    "primary": "#3a6758",
                    "on-primary-fixed": "#002118",
                    "on-tertiary-fixed-variant": "#504631",
                    "surface-container-low": "#f5f3f3",
                    "surface-container": "#efeded",
                    "secondary-container": "#aed6fe",
                    "on-secondary-container": "#345d80",
                    "on-secondary": "#ffffff",
                    "on-surface-variant": "#404945",
                    "secondary-fixed-dim": "#a3cbf3",
                    "error": "#ba1a1a",
                    "on-error": "#ffffff",
                    "tertiary-fixed-dim": "#d4c5aa",
                    "primary-container": "#a7d7c5",
                    "outline": "#717975",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#325f51",
                    "on-secondary-fixed-variant": "#1f4a6c"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "section-margin": "40px",
                    "element-gap": "16px",
                    "base": "8px",
                    "container-padding": "24px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Quicksand"],
                    "headline-lg": ["Quicksand"],
                    "label-md": ["Quicksand"],
                    "headline-md": ["Quicksand"],
                    "body-lg": ["Quicksand"],
                    "body-md": ["Quicksand"],
                    "label-sm": ["Quicksand"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "500"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen p-4">
<!-- Decorative Atmospheric Elements -->
<div class="absolute top-10 left-10 w-32 h-32 bg-primary-container/30 rounded-full blur-3xl animate-float" style="animation-delay: 0s;"></div>
<div class="absolute bottom-20 right-10 w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl animate-float" style="animation-delay: 2s;"></div>
<div class="absolute top-1/2 left-20 w-16 h-16 bg-tertiary-container/40 rounded-full blur-2xl animate-float" style="animation-delay: 1s;"></div>
<main class="relative z-10 w-full max-w-md">
<!-- Main Login Card -->
<div class="clay-card p-8 md:p-12 flex flex-col items-center">
<!-- Logo Section -->
<div class="clay-logo-icon w-20 h-20 rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="pets" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">PawPath</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Cuidamos el camino de tu mascota</p>
</div>
<!-- Login Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-4" for="email">Correo Electrónico</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-outline" data-icon="mail">mail</span>
<input class="clay-input w-full py-4 pl-14 pr-6 rounded-full font-body-md text-body-md text-on-surface" id="email" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-4">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-5 text-outline" data-icon="lock">lock</span>
<input class="clay-input w-full py-4 pl-14 pr-6 rounded-full font-body-md text-body-md text-on-surface" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-5 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-3 px-4">
<div class="relative flex items-center justify-center h-6 w-6">
<input class="peer appearance-none h-6 w-6 rounded-lg clay-input checked:bg-primary transition-all cursor-pointer" id="remember" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white text-sm scale-0 peer-checked:scale-100 transition-transform pointer-events-none" data-icon="check">check</span>
</div>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Recordarme</label>
</div>
<!-- Action Button -->
<button class="clay-button-primary w-full py-4 font-headline-md text-headline-md mt-4" type="submit">
                    Iniciar Sesión
                </button>
</form>
<!-- Secondary Actions -->
<div class="mt-10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-4">¿Eres nuevo en la familia?</p>
<button class="font-label-md text-label-md text-secondary border-2 border-secondary-container rounded-full px-8 py-3 hover:bg-secondary-fixed transition-colors">
                    Crear cuenta de PawPath
                </button>
</div>
</div>
<!-- Decorative Footer Quote -->
<div class="mt-8 text-center px-4">
<p class="font-label-sm text-label-sm text-outline opacity-60">Seguridad veterinaria de nivel premium con un toque de cariño digital.</p>
</div>
</main>
<!-- Background Images for extra texture/context (puffy 3D style icons) -->
<div class="fixed top-[-5%] right-[-5%] opacity-10 pointer-events-none select-none">
<img class="w-96 h-96 object-contain" data-alt="A large, soft, 3D claymorphic illustration of a friendly golden retriever face, featuring smooth rounded edges and tactile lighting, in a warm mint green and sand color palette consistent with a veterinary brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOAz7JcMBmvXTe1XR_R-PnrntuYWGudunB9vStblNBHwnlXZsLoIevFDiHWL2Uc_ZPEfFzI_6vFixgw-G7Hq1PpyUOJYwu0RFhDrDYZRT2VAlBETgblFv4SyUWqEvCt0rl6WRQvgC9GnkDjlHnaTwsssxmtX7PUbUc0d8nyPt348_y5ILkizzRJXUfd43aeFBdljqLSsdB9TXdKVyeLemsd5ngydGZiVcXyEZRIUpMWWGAKbgSRr2R"/>
</div>
<div class="fixed bottom-[-10%] left-[-5%] opacity-10 pointer-events-none select-none">
<img class="w-80 h-80 object-contain" data-alt="A collection of 3D claymorphic medical icons like a stethoscope, a bone, and a heart, rendered with soft inner shadows and high-key lighting on a pastel surface, evoking a playful yet professional veterinary care aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpL9D4MArFe8Ka-vB3E4W3gz5YoLsvpm1CzxXxglrRN4HOzVLQmseQvdmGGJLKr8YmyiYlKNdlNwc2JtY0bvvBu-_b7EYHjglY8dw6cHH-H978eT3c6EI9JVuo9TaTRsQbsm53ZaemUKAxbVwHLzKDbKnGbkvw1FWqeWhh7GaCd1Mh9TPM36aG57NZph-QDbtj8tbhEboDB56czo4Qj5MtDwHI8Ovpc0OXGMgxdetzvGCImC2nfvu4"/>
</div>
<script>
        // Micro-interaction for input fields
        const inputs = document.querySelectorAll('.clay-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#3a6758';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#717975';
            });
        });

        // Simple button press animation enhancement
        const mainBtn = document.querySelector('.clay-button-primary');
        mainBtn.addEventListener('mousedown', () => {
            mainBtn.style.transform = 'scale(0.95) translateY(2px)';
        });
        mainBtn.addEventListener('mouseup', () => {
            mainBtn.style.transform = 'scale(1) translateY(0)';
        });
        mainBtn.addEventListener('mouseleave', () => {
            mainBtn.style.transform = 'scale(1) translateY(0)';
        });
    </script>
</body></html>
